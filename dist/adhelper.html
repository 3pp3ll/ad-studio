<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: RTL app shell. Side navigation beside one working column; nav becomes a scrolling row on phones. */
:root{
  --bg:#FFFFFF; --surface:#F4F7FA; --line:#E1E7EE; --fg:#2E3947; --muted:#687588;
  --primary:#56B9F0; --primary-ink:#0F6FA8; --primary-soft:#E5F4FD; --on-primary:#0A2B40;
  --violet:#B8A9E3; --violet-ink:#6753AE; --violet-soft:#F1EDFB;
  --ok:#3FBF9A; --ok-ink:#187A5E; --ok-soft:#E2F6EF;
  --err:#D9686B; --err-ink:#AE4548; --err-soft:#FBEAEA;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1A212B; --line:#2C3644; --fg:#E4E9F0; --muted:#98A4B4;
  --primary:#5BBDF2; --primary-ink:#8FD3F8; --primary-soft:#163246; --on-primary:#07202F;
  --violet:#A999DA; --violet-ink:#C6BAEE; --violet-soft:#272240;
  --ok:#4CC7A3; --ok-ink:#81DDC1; --ok-soft:#14332B;
  --err:#E07A7D; --err-ink:#F1A6A8; --err-soft:#3A1F21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1A212B; --line:#2C3644; --fg:#E4E9F0; --muted:#98A4B4;
  --primary:#5BBDF2; --primary-ink:#8FD3F8; --primary-soft:#163246; --on-primary:#07202F;
  --violet:#A999DA; --violet-ink:#C6BAEE; --violet-soft:#272240;
  --ok:#4CC7A3; --ok-ink:#81DDC1; --ok-soft:#14332B;
  --err:#E07A7D; --err-ink:#F1A6A8; --err-soft:#3A1F21; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.4}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.05rem;font-weight:500} h3{font-size:.95rem;font-weight:500}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand{flex-wrap:wrap;row-gap:0}.brand img{width:32px;height:32px;object-fit:contain;display:block}.brand .co{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}.brand .sep{color:var(--line);font-weight:400}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.87rem}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;margin-top:20px}
.shell.solo{grid-template-columns:minmax(0,1fr)}
nav{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:start;padding:9px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);white-space:nowrap}
nav button:hover{background:var(--surface);color:var(--fg)}
nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{display:flex;flex-direction:column;gap:22px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.sub{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cols{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--primary)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.v{background:var(--violet-soft);border-color:transparent;color:var(--violet-ink)}
.btn.d{color:var(--err-ink)} .btn.d:hover{border-color:var(--err)}
.btn.big{padding:16px 22px;font-size:1.05rem;font-family:var(--display);justify-content:center}
.btn.s{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary-ink);outline-offset:2px}
.link{border:0;background:none;color:var(--primary-ink);cursor:pointer;padding:0;text-decoration:underline}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.87rem;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;color:var(--fg);width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{min-height:96px;resize:vertical;line-height:1.7}
.note{font-size:.85rem;border-radius:var(--r);padding:9px 12px}
.note.ok{background:var(--ok-soft);color:var(--ok-ink)} .note.err{background:var(--err-soft);color:var(--err-ink)}
.note.info{background:var(--violet-soft);color:var(--violet-ink)}
.pill{display:inline-block;font-size:.76rem;padding:1px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap}
.pill.v{background:var(--violet-soft);color:var(--violet-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok-ink)} .pill.err{background:var(--err-soft);color:var(--err-ink)}
.pill.m{background:var(--line);color:var(--muted)}
.auth{max-width:420px;margin:24px auto;width:100%}
.out{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;min-height:150px}
.out h3{color:var(--violet-ink);font-size:.82rem}
.out p,.adtext{white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
.out ul{margin:0;padding-inline-start:18px}
.ad{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.ad:first-child{border-top:0;padding-top:0}
.ad img,.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.thumb{display:grid;place-items:center;color:var(--muted);font-size:.72rem}
.ad .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.shot{max-width:100%;max-height:440px;border-radius:12px;display:block;margin-inline:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem;white-space:nowrap}
td.n,th.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td input{padding:5px 8px;width:84px}
.plan{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.cur{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.plan .price{font-family:var(--display);font-size:1.6rem;font-weight:700}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.bar i.full{background:var(--err)}
.store{display:flex;flex-direction:column;gap:6px}
.media{display:flex;flex-wrap:wrap;gap:12px}.media img,.media video{max-height:280px;max-width:100%;border-radius:10px;background:var(--line)}
article.panel h3{color:var(--violet-ink);font-size:.82rem}article.panel ul{margin:0;padding-inline-start:18px}
button.pill{border:0;cursor:pointer;font-family:inherit}
.soon{opacity:.55;pointer-events:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.kv.total{border-bottom:0;font-family:var(--display)}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:grid;place-items:center;padding:16px;z-index:20}
#modal .box{background:var(--bg);border-radius:14px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
#busy{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:16px;margin:auto;max-width:320px;z-index:30;text-align:center;box-shadow:0 6px 24px rgba(10,20,30,.18)}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline:16px;margin:auto;max-width:400px;z-index:30;text-align:center;box-shadow:0 6px 24px rgba(10,20,30,.18)}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background .15s,border-color .15s}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.thumb84{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.ref{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.reftag{position:relative;margin:0}.reftag figcaption{position:absolute;inset-inline-start:6px;top:6px}
label.btn:focus-within{outline:2px solid var(--primary-ink);outline-offset:2px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;font-size:.87rem}
.btn.s{white-space:nowrap}
.dim{opacity:.5;font-weight:400}
.link{padding-block:6px}button.pill{padding:5px 11px}
@media (max-width:760px){
  .top{gap:8px 10px}.top .lbl{display:none}.top .seg{order:4}.top .who{order:5;margin-inline-start:auto}
  .btn.s{padding:7px 12px}
  nav{scrollbar-width:none;scroll-snap-type:x proximity}nav button{scroll-snap-align:start}
}
.out>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.stage{background:#0b1118;color:#9fb0c3;border-radius:12px;overflow:hidden;position:relative;width:100%;margin-inline:auto;display:grid;place-items:center;font-size:.9rem}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .cap{position:absolute;inset-inline:0;bottom:0;padding:28px 14px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));font-family:var(--display);font-weight:500;text-align:center;font-size:1.05rem}
.kb{animation:kb linear both}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.kb{animation:none}}
video.thumb84{object-fit:cover}
.cta{display:flex;flex-direction:column;gap:3px;align-items:center}.cta .sub{font-size:.76rem}
.ref .reftag figcaption{inset-inline-start:auto;inset-inline-end:-6px;top:-8px}
button.pill.err{font-size:.95rem;line-height:1;padding:5px 9px}
.ico{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;font-family:var(--display);font-weight:700;font-size:.95rem;padding:0}
.ico:hover{border-color:var(--primary)}.ico[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink)}
.ico.add{border-style:dashed}.ico.sm{width:36px;height:36px;border-radius:10px}
.ico{width:auto;min-width:46px;padding-inline:8px;font-size:.8rem;font-weight:500}.ico.sm{min-width:36px;width:36px;padding:0}
.ico img{width:28px;height:28px;object-fit:contain;display:block}.ico span{white-space:nowrap;padding-inline:4px}
span.ico{cursor:default}.socup{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.inv{display:flex;flex-direction:column;gap:6px}
#modal h3{color:var(--violet-ink);font-size:.82rem}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.foot img{width:40px;height:40px;object-fit:contain;display:block}.foot .row.sub{gap:6px 16px}
.prose{max-width:68ch}.prose p{white-space:pre-wrap;overflow-wrap:anywhere}.prose .lead{font-family:var(--display);font-size:1.1rem}
:root{--m1:#F26A0F;--m2:#1B8FBF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m1:#F37927;--m2:#329AC5}}
:root[data-theme="dark"]{--m1:#F37927;--m2:#329AC5}
.mico{display:block;flex:none}.mico .s1{stop-color:var(--m1)}.mico .s2{stop-color:var(--m2)}
.btn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

</style>
</head>

</div>
<div id="modal" hidden></div>

/* v3 -> v4: admins become users, new settings, cached ad sizes.
   v4 -> v5: video quota in seconds, add-ons, scenes.
   v5 -> v6: several attachments (images and video), product type, larger default storage. Anything older than v3 is reseeded. */
function migrate(o) {
  if (!o || typeof o !== 'object' || !o.v || o.v < 3 || !Array.isArray(o.users) || !o.settings) return null;
  if (o.v === 3) {
    o.users.forEach(u => {
      u.isAdmin = !!u.isAdmin; u.adminRole = u.adminRole || null; u.permissions = u.permissions || [];
      if (u.storageMB === undefined) u.storageMB = null;
      if (u.used.videos == null) u.used.videos = 0;
    });
    (o.admins || []).forEach(a => {
      const email = String(a.email || '').toLowerCase(); if (!email) return;
      let u = o.users.find(x => x.email === email);
      if (!u) { u = newUser({ name: email.split('@')[0], email }); o.users.push(u); }
      u.adminRole = ROLES[a.role] ? a.role : 'Admin'; u.isAdmin = a.active !== false;
    });
    if (!o.users.some(u => u.isAdmin && u.adminRole === 'Super Admin')) {
      let u = o.users.find(x => x.email === 'owner@example.com');
      if (!u) { u = newUser({ name: 'المالك', email: 'owner@example.com' }); o.users.push(u); }
      u.isAdmin = true; u.adminRole = 'Super Admin';
    }
    delete o.admins; delete o.admin; delete o.adminRole;
    o.plans.forEach(p => { if (p.storage == null) p.storage = { free: 50, mid: 150, gold: 250 }[p.id] || 100; });
    o.settings = { ...defaultSettings(), ...o.settings };
    ['orModel', 'imgProvider', 'imgQuality', 'video'].forEach(k => delete o.settings[k]);
    (o.suggestions || []).forEach(s => { Object.assign(s, analyze(s.text)); delete s.note; });
    o.draft = { ...newDraft(), ...(o.draft || {}) };
    o.ads.forEach(a => { a.refImg = a.refImg || null; a.refNote = a.refNote || ''; a.bytes = calcBytes(a); });
    o.aiLog = o.aiLog || [];
    if (o.route === 'a-login') o.route = 'login';
    o.v = 4;
  }
  if (o.v === 4) {
    o.plans.forEach(p => { if (p.vidSecs == null) p.vidSecs = (p.videos || 0) * 15; delete p.videos; });
    o.users.forEach(u => { if (u.used.vidSecs == null) u.used.vidSecs = (u.used.videos || 0) * 6; delete u.used.videos; u.extra = u.extra || {}; });
    o.addons = o.addons || defaultAddons();
    o.draft = { ...newDraft(), ...(o.draft || {}) };
    o.ads.forEach(a => { if (a.scenes === undefined) a.scenes = null; });
    if (o.settings.mailName === 'مساعد الإعلانات') o.settings.mailName = 'استوديو الإعلانات';
    o.settings.vidSec = Math.min(15, Math.max(6, +o.settings.vidSec || 6));
    if (o.route === 'a-login') o.route = 'login';
    o.v = 5;
  }
  if (o.v === 5) {
    const conv = x => { x.refs = x.refs || (x.refImg ? [{ id: x.refImg.id, size: x.refImg.size, name: x.refImg.name, kind: 'img' }] : []); delete x.refImg; x.category = x.category || 'general'; };
    o.draft = { ...newDraft(), ...(o.draft || {}) }; conv(o.draft);
    o.ads.forEach(a => { conv(a); a.bytes = calcBytes(a); });
    o.plans.forEach(p => { if (STORE_DEF[p.id] && p.storage === { free: 50, mid: 150, gold: 250 }[p.id]) p.storage = STORE_DEF[p.id]; });
    o.v = 6;
  }
  return o.v === VER ? o : null;
}

function loadState() {
  let o = null;

  S = migrate(o) || seed();
  S.settings.company = { ...defaultCompany(), ...(S.settings.company || {}) };

  if (!S.settings.brand.v) { if (!S.settings.brand.primary && !S.settings.brand.accent) Object.assign(S.settings.brand, { primary: '#1b8fbf', accent: '#f26a0f', dark: false }); S.settings.brand.v = 2; }
}
function save() {

  catch (e) { if (e && e.name === 'QuotaExceededError') toast(t('m_ls_full'), 1); }

/* Passwords: seeded demo accounts use DEMO_PASS; sign-ups store a salted SHA-256 hash. */
async function sha(x) {
  try {
    const b = await crypto.subtle.digest('SHA-256', enc.encode(x));
    return [...new Uint8Array(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 2166136261; for (const c of x) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
    return 'f' + (h >>> 0).toString(16);
  }
}

<script>
/* Media files (generated images, videos, reference images) live in IndexedDB.
   MEDIA maps id -> object URL for display; BLOBS maps id -> Blob for re-reading. */
let DB = null;
const MEDIA = new Map(), BLOBS = new Map();

const idb = () => new Promise((ok, no) => {
  try {
    const r = indexedDB.open('adhelper-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  } catch (e) { no(e); }
});
const tx = (mode, fn) => new Promise((ok, no) => {
  if (!DB) return ok();
  try {
    const x = DB.transaction('m', mode); fn(x.objectStore('m'));
    x.oncomplete = () => ok(); x.onerror = x.onabort = () => no(x.error);
  } catch (e) { no(e); }
});
const remember = (id, b) => { BLOBS.set(id, b); MEDIA.set(id, URL.createObjectURL(b)); };

async function mput(id, b) {
  remember(id, b);
  if (!DB) { toast(t('m_no_persist'), 1); return; }
  try { await tx('readwrite', st => st.put(b, id)); } catch (e) { toast(t('m_save_fail'), 1); }
}
function mdel(id) {
  const u = MEDIA.get(id);
  if (u) { URL.revokeObjectURL(u); MEDIA.delete(id); }
  BLOBS.delete(id);
  tx('readwrite', st => st.delete(id)).catch(() => {});
}
function mclear() {
  MEDIA.forEach(u => URL.revokeObjectURL(u)); MEDIA.clear(); BLOBS.clear();
  tx('readwrite', st => st.clear()).catch(() => {});
}
async function mload() {
  try {
    DB = await idb();
    await tx('readonly', st => {
      st.openCursor().onsuccess = e => { const c = e.target.result; if (c) { remember(c.key, c.value); c.continue(); } };
    });
  } catch (e) { DB = null; }
}

const owned = id => S.ads.some(a => mediaIds(a).includes(id));
/* Deletes a file once neither a saved ad nor the open draft uses it. */
const orphan = id => { if (id && !owned(id) && !mediaIds(S.draft).includes(id)) mdel(id); };

async function toBlob(u) {
  if (!u.startsWith('data:')) return (await fetch(u)).blob();
  const i = u.indexOf(','), mime = (u.slice(0, i).match(/:(.*?)(;|$)/) || [])[1] || 'image/png';
  const bin = atob(u.slice(i + 1)), arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: mime });
}
const blobToDataURL = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(b); });

/* An attachment as an image data URL: the image itself, or the first frame of a video.
   Kept in memory only (save() strips dataURL) and rebuilt from the stored file when needed. */
async function refData(ref) {
  if (!ref.dataURL) {
    const b = BLOBS.get(ref.id);
    if (!b) throw new Error(t('e_ref_missing'));
    ref.dataURL = ref.kind === 'vid' ? await videoFrame(b) : await blobToDataURL(b);
  }
  return ref.dataURL;
}

<script>
/* Canvas poster (the no-server fallback image), image URLs and reference-image helpers. */
const imgCache = new Map();
const loadImg = url => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('image')); im.src = url; });

/* Draws the fallback poster. With a reference image it becomes the background under a dark layer. */
function drawPoster(o, bg) {
  const [w, h] = PLATS[o.platform].r, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d'), s = (o.img && o.img.seed) || 1, kid = o.style === 'kids', m = Math.min(w, h) * .1;
  if (bg) {
    const k = Math.max(w / bg.width, h / bg.height);
    x.drawImage(bg, (w - bg.width * k) / 2, (h - bg.height * k) / 2, bg.width * k, bg.height * k);
    x.fillStyle = 'rgba(8,18,28,.55)'; x.fillRect(0, 0, w, h);
  } else {
    const pal = [['#8FD4F7', '#C9BBEE'], ['#BFE7FB', '#9BDCC8'], ['#D6CCF3', '#8CCDF3'], ['#A8E3D2', '#B9A9E6']][s % 4].slice();
    if (kid) { pal[0] = ['#FFD86B', '#8FE0C2', '#9AD4FF'][s % 3]; pal[1] = ['#FF9EC4', '#FFC27A', '#C7A6FF'][s % 3]; }
    const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(255,255,255,.28)';
    for (let i = 0; i < (kid ? 12 : 5); i++) { x.beginPath(); x.arc((s * 37 * (i + 1)) % w, (s * 61 * (i + 2)) % h, 40 + (s * (i + 3)) % 120, 0, 7); x.fill(); }
    x.fillStyle = 'rgba(255,255,255,.86)'; x.beginPath(); x.roundRect(m, h * .3, w - 2 * m, h * .4, 22); x.fill();
  }
  x.direction = 'rtl'; x.textAlign = 'center'; x.fillStyle = bg ? '#FFFFFF' : '#22384A';
  const fs = Math.round(w * .075);
  x.font = `700 ${fs}px Alexandria,"IBM Plex Sans Arabic",Tahoma,sans-serif`;
  const lines = []; let l = '';
  for (const wd of o.product.trim().split(/\s+/)) {
    const tr = l ? l + ' ' + wd : wd;
    if (x.measureText(tr).width > w - 2 * m - 40 && l) { lines.push(l); l = wd; } else l = tr;
  }
  lines.push(l);
  const ls = lines.slice(0, 3), y0 = h * .5 - (ls.length - 1) * fs * .7 - fs * .2;
  ls.forEach((tx, i) => x.fillText(tx, w / 2, y0 + i * fs * 1.4));
  x.font = `500 ${Math.round(fs * .42)}px "IBM Plex Sans Arabic",Tahoma,sans-serif`;
  x.fillStyle = bg ? 'rgba(255,255,255,.88)' : '#4A6276';
  x.fillText(ctaOf(o).replace(/[.。]$/, ''), w / 2, h * .7 - 18, w - 2 * m - 30);
  return c.toDataURL('image/jpeg', .85);
}

function imgURL(o) {
  if (!o || !o.img) return '';
  if (o.img.id && MEDIA.has(o.img.id)) return MEDIA.get(o.img.id);
  if (o.img.data) return o.img.data;
  const k = [o.product, o.platform, o.img.seed, o.goal, o.style, o.lang].join('|');
  if (!imgCache.has(k)) imgCache.set(k, drawPoster(o, null));

}
const vidURL = o => (o && o.vid && MEDIA.get(o.vid.id)) || '';
/* First frame of a video file as a JPEG data URL (the form image and video models accept). */
function videoFrame(blob, max = 1280) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(blob), v = document.createElement('video');
    const done = (f, x) => { clearTimeout(timer); URL.revokeObjectURL(url); f(x); };
    const timer = setTimeout(() => done(no, new Error(t('e_frame'))), 10000);
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) { done(no, e); } };
    v.onseeked = () => {
      try {
        const k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
        c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        done(ok, c.toDataURL('image/jpeg', .86));
      } catch (e) { done(no, e); }
    };
    v.onerror = () => done(no, new Error(t('e_frame')));
    v.src = url;
  });
}

/* Reference uploads are downscaled so they stay small in storage and in API requests. */
async function shrinkFile(file, max = 1600) {
  try {
    const url = URL.createObjectURL(file), im = await loadImg(url); URL.revokeObjectURL(url);
    const k = Math.min(1, max / Math.max(im.width, im.height));
    if (k === 1 && file.size < 1500000) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), 'image/jpeg', .88));
  } catch (e) { return file; }
}

const tag = s => '#' + s.trim().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, '_');

/* Local stand-in for the AI review of a suggestion. */
function analyze(x) {
  const k = [['صور', 'img'], ['image', 'img'], ['باق', 'plans'], ['plan', 'plans'], ['منص', 'plat'], ['platform', 'plat'], ['حمل', 'camp'], ['campaign', 'camp'], ['سرع', 'perf'], ['fast', 'perf']].find(p => x.toLowerCase().includes(p[0]));
  return { cat: k ? k[1] : 'gen', score: Math.min(5, 2 + (x.length > 40) + (x.length > 90) + (k ? 1 : 0)) };
}

/* ---------- OpenRouter ---------- */
/* Live when switched on and either a key is set (direct) or the API URL points at your own proxy. */
const aiOn = () => { const s = S.settings; return !!(s.orLive && (s.orKey || !/openrouter\.ai/i.test(s.orBase))); };
const apiBase = () => S.settings.orBase.replace(/\/+$/, '');
const via = u => /^https?:/.test(u) ? u.replace(/^https?:\/\/openrouter\.ai\/api\/v1/i, apiBase()) : apiBase() + u;
const authHeader = () => S.settings.orKey ? { Authorization: 'Bearer ' + S.settings.orKey } : {};
let nBusy = 0;
const busy = v => { nBusy += v ? 1 : -1; const b = $('#busy'); b.textContent = t('busy'); b.hidden = nBusy <= 0; };
const logAI = op => {
  const st = S.settings, m = aiOn() ? ({ image: st.imgModel, video: st.vidModel, suggest: '' }[op] ?? st.txtModel) : '';
  S.aiLog.unshift({ uid: S.uid, op, m, date: new Date().toISOString() });
  if (S.aiLog.length > 200) S.aiLog.pop();
};

async function orFetch(path, body) {
  let r;
  try {
    r = await fetch(via(path), { method: body ? 'POST' : 'GET', headers: { ...authHeader(), ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error(t('e_net')); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && (j.error.message || j.error)) || ('HTTP ' + r.status));
  return j;
}

/* Returns the model's text, or null so the caller falls back to the template. */
async function ask(prompt) {
  if (!aiOn()) return null;
  busy(1);
  try {
    const j = await orFetch('/chat/completions', { model: S.settings.txtModel, messages: [
      { role: 'system', content: 'أنت كاتب إعلانات محترف متعدد اللغات. اكتب الناتج باللغة المطلوبة فقط، وأجب بالمطلوب دون مقدمات أو شرح.' },
      { role: 'user', content: prompt }] });
    return (j.choices[0].message.content || '').trim() || null;
  } catch (e) { toast(t('m_or_fail', { e: e.message }), 1); return null; }
  finally { busy(0); }
}
const brief = d => `المنتج/الخدمة: ${d.product}\n${CAT_AR[d.category] ? `نوع المنتج: ${CAT_AR[d.category]}\n` : ''}الجمهور المستهدف: ${d.audience}\nالمنصة: ${PLAT_AR[d.platform]}${PLATS[d.platform].max ? ` (الحد ${PLATS[d.platform].max} حرفاً)` : ''}\nالهدف: ${GOAL_AR[d.goal]}\nلغة الناتج: ${LANG_AR[lg(d)]} (اكتب الناتج كله بهذه اللغة)${d.style === 'kids' ? '\nالمحتوى موجّه للأطفال: لغة بسيطة ومرحة وآمنة ومناسبة لأعمارهم.' : ''}`;
const adPrompt = (style, d) => `اكتب نص إعلان واحداً بأسلوب ${STYLE_AR[style]}.\n${brief(d)}`;

/* Decor design: the product type is decor or furniture and there are attachments to build on. */
const decorMode = d => (d.category === 'decor' || d.category === 'furniture') && (d.refs || []).length > 0;
const decorPrompt = d => `صمّم ${d.category === 'furniture' ? 'تأثيثاً' : 'ديكوراً داخلياً'} واقعياً للمساحة الظاهرة في الصور المرفقة. حافظ على أبعاد المكان والجدران والأبواب والنوافذ وزاوية التصوير كما هي، وأضف ${d.category === 'furniture' ? 'الأثاث المناسب' : 'الأثاث والإضاءة والإكسسوارات المناسبة'} بحيث يظهر الناتج كصورة حقيقية ملتقطة للمكان نفسه بعد تجهيزه.\nالمطلوب: ${d.imgDesc || d.product}\nالجمهور: ${d.audience}`;
async function refImages(d, max = 4) {
  const out = [];
  for (const r of (d.refs || []).slice(0, max)) { try { out.push(await refData(r)); } catch (e) {} }
  return out;
}

/* Image: text-only, or text + the attachments (video attachments go as their first frame). Returns a Blob. */
async function aiImage(d) {
  const imgs = await refImages(d);
  const prompt = decorMode(d) && imgs.length ? `${decorPrompt(d)}\nنسبة الأبعاد ${PLATS[d.platform].rt}.`
    : `${d.imgDesc || genDesc(d)}\nنسبة الأبعاد ${PLATS[d.platform].rt}. نص الإعلان للاستلهام: ${d.out.text || gen(d.style, d)}`;
  const content = imgs.length
    ? [{ type: 'text', text: (d.refNote ? d.refNote + '\n' : '') + prompt }, ...imgs.map(url => ({ type: 'image_url', image_url: { url } }))]
    : prompt;
  const j = await orFetch('/chat/completions', { model: S.settings.imgModel, modalities: ['image', 'text'], messages: [{ role: 'user', content }] });
  const im = j.choices && j.choices[0].message.images, u = im && im[0] && im[0].image_url && im[0].image_url.url;
  if (!u) throw new Error(t('e_no_image'));
  return toBlob(u);
}

/* Video: async job. The first frame is the designed still (decor mode) or the first attachment;
   if the model refuses the frame, retry text-only. */
async function aiVideo(d, onStatus, secs, firstFrame) {
  const st = S.settings, ep = st.vidEndpoint || '/videos', hasRef = (d.refs || []).length > 0;
  const script = d.scenes && d.scenes.script ? '\nالحوار المنطوق في المقطع: ' + d.scenes.script.trim() : '';
  const lead = firstFrame ? 'مقطع واقعي كأنه مصوَّر داخل هذا المكان بعد تجهيزه كما في الصورة: حركة كاميرا هادئة تستعرض الأثاث والتفاصيل دون تغيير تصميم المكان.\n' : '';
  const body = { model: st.vidModel, prompt: (lead + (hasRef && d.refNote ? d.refNote + '\n' : '') + (d.vidDesc || (firstFrame ? '' : genVidDesc(d))) + script).trim(), duration: secs, aspect_ratio: PLATS[d.platform].rt, resolution: '720p' };
  let j = null, frame = firstFrame;
  if (!frame && hasRef) { try { frame = await refData(d.refs[0]); } catch (e) {} }
  if (frame) {
    try { j = await orFetch(ep, { ...body, frame_images: [{ type: 'image_url', image_url: { url: frame }, frame_type: 'first_frame' }] }); }
    catch (e) { toast(t('m_ref_vid_fail'), 1); }
  }
  if (!j) j = await orFetch(ep, body);
  const purl = j.polling_url || (ep + '/' + j.id);
  let n = 0;
  while (j.status !== 'completed') {
    if (j.status === 'failed') throw new Error((j.error && (j.error.message || j.error)) || t('e_vid_failed'));
    if (++n > 90) throw new Error(t('e_vid_timeout'));
    onStatus(t('m_vid_wait'));
    await new Promise(r => setTimeout(r, 5000));
    j = await orFetch(purl);
  }
  const r = await fetch(via(j.unsigned_urls[0]), { headers: authHeader() });
  if (!r.ok) throw new Error(t('e_vid_dl'));
  return r.blob();
}

<script>
/* Exports built in the browser: ZIP package, PowerPoint file, and invoices. */

/* ---------- ZIP (stored, no compression) ---------- */
const CRC_T = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; } return tb; })();

    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, data);

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, tm, true); c.setUint16(14, dt, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);

}
/* Saves a file to the device. Inside an embedded preview downloads are blocked, so it only explains. */

}

/* ---------- an ad's full content ---------- */
const vidExt = b => /webm/.test(b.type) ? 'webm' : /quicktime/.test(b.type) ? 'mov' : 'mp4';
async function toJpeg(url, max = 1920) {

  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);

}
/* Every image (as JPEG) and video that belongs to the ad, each file once. */
async function adAssets(a) {

  for (const s of (a.scenes && a.scenes.items) || []) { n++; if (seen.has(s.id) || !MEDIA.get(s.id)) continue; seen.add(s.id); if (s.kind === 'vid') await addVid(s.id, 'scene-' + n, t('sc_clip') + ' ' + n); else await addImg(MEDIA.get(s.id), `scene-${n}.jpg`, t('sc_image') + ' ' + n); }

function adText(a) {

/* ---------- PowerPoint (.pptx is a ZIP of XML parts) ---------- */
const xe = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

const GRP = '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>';

let CART = {}, LASTINV = null;
/* pack: the input is a number of bundles. unit: the input is the amount itself, priced per step. */

  scadd(d) { const dr = S.draft, m = d.src === 'vid' ? dr.vid : dr.img; if (!m || !m.id) return; if (dr.scenes.items.length >= 8) { toast(t('sc_max'), 1); return; } dr.scenes.items.push({ id: m.id, size: m.size, kind: d.src === 'vid' ? 'vid' : 'img', dur: d.src === 'vid' ? 4 : 3, cap: '', name: t(d.src === 'vid' ? 'sc_from_vid' : 'sc_from_img') }); if (draftAd()) autosave(); save(); render(); },
  scdel(d) { const it = S.draft.scenes.items.splice(+d.i, 1)[0]; if (draftAd()) autosave(); else if (it) orphan(it.id); save(); render(); },
  scmove(d) { const a = S.draft.scenes.items, i = +d.i, j = i + +d.by; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; if (draftAd()) autosave(); save(); render(); },
  /* Splits the chosen total evenly across the scenes, in whole seconds. */
  scfit() { const sc = S.draft.scenes, n = sc.items.length; if (!n) return; const base = Math.max(1, Math.floor(sc.total / n)); let extra = Math.max(0, sc.total - base * n); sc.items.forEach(i => { i.dur = base + (extra-- > 0 ? 1 : 0); }); if (draftAd()) autosave(); save(); render(); },
  scsave() { if (!needDraft() || !canSave()) return; autosave(); render(); toast(t('m_saved')); },
  scstop() { scStop(); },
  scplay() {
    scStop();
    const items = S.draft.scenes.items.filter(i => MEDIA.get(i.id) && +i.dur > 0), st = $('#stage'), bar = $('#stagebar');
    if (!items.length || !st) { toast(t('sc_none'), 1); return; }
    const total = items.reduce((n, i) => n + +i.dur, 0), t0 = performance.now();
    PLAY = {};
    const tick = () => { if (!PLAY) return; const e = (performance.now() - t0) / 1000; bar.style.width = Math.min(100, e / total * 100) + '%'; if (e < total) PLAY.raf = requestAnimationFrame(tick); };
    const show = k => {
      if (!PLAY) return;
      if (k >= items.length) { PLAY = null; bar.style.width = '100%'; const v = st.querySelector('video'); if (v) v.pause(); return; }
      const it = items[k], u = MEDIA.get(it.id);

      PLAY.t = setTimeout(() => show(k + 1), +it.dur * 1000);
    };

/* ---------- forms (data-form) ---------- */
const F = {
  async signup(f) {
    const name = f.name.value.trim(), email = f.email.value.trim().toLowerCase(), pass = f.pass.value;
    if (!name) T.err = t('e_name');
    else if (!/^\S+@\S+\.\S+$/.test(email)) T.err = t('e_email');
    else if (S.users.some(u => u.email === email)) T.err = t('e_email_used');
    else if (!(pass.length >= 8 && /[A-Z]/.test(pass) && /[a-z]/.test(pass) && /\d/.test(pass) && /[^A-Za-z0-9]/.test(pass))) T.err = t('e_pass');
    else {
      const s = rid('s'), u = newUser({ name, email, phone: f.phone.value.trim(), pw: { s, h: await sha(s + pass) } });
      S.users.push(u); S.uid = u.id; return go('home');
    }
    render();
  },
  async chpass(f) {
    const u = cur(), pass = f.pass.value;
    if (!(await checkPass(u, f.cur.value))) T = { err: t('pw_wrong'), msg: '' };
    else if (!(pass.length >= 8 && /[A-Z]/.test(pass) && /[a-z]/.test(pass) && /\d/.test(pass) && /[^A-Za-z0-9]/.test(pass))) T = { err: t('e_pass'), msg: '' };
    else { const s = rid('s'); u.pw = { s, h: await sha(s + pass) }; T = { err: '', msg: t('pw_done') }; save(); }
    render();
  },
  async login(f) {
    const u = S.users.find(u => u.email === f.email.value.trim().toLowerCase());
    T.msg = '';
    if (!u || !(await checkPass(u, f.pass.value))) { T.err = t('e_login'); return render(); }
    S.uid = u.id; go('home');
  }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && A[a.dataset.act]) A[a.dataset.act](a.dataset);
  else if (e.target.id === 'modal') A.mclose();
});
document.addEventListener('submit', e => { e.preventDefault(); const n = e.target.dataset.form; if (F[n]) F[n](e.target); });
/* Escape closes the dialog; Tab stays inside it. */
document.addEventListener('keydown', e => {
  const m = $('#modal'); if (m.hidden) return;
  if (e.key === 'Escape') return A.mclose();
  if (e.key !== 'Tab') return;
  const f = [...m.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled); if (!f.length) return;
  const first = f[0], last = f[f.length - 1], act = document.activeElement;
  if (!m.contains(act)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && act === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus(); }
});
function bind(e) {
  const el = e.target;
  if (el.dataset.ref !== undefined) { if (e.type === 'change') A.refpick(el.files); return; }
  if (el.dataset.logo) { if (e.type === 'change') A.logoup(el.dataset.logo, el.files[0]); return; }
  if (el.dataset.logotext) { if (e.type === 'change') { const v = el.value.trim(); if (v && !/^(<svg[\s>]|https:\/\/)/i.test(v)) { toast(t('e_logo'), 1); return; } co()[el.dataset.logotext] = v || DEFAULT_LOGO; save(); render(); } return; }
  if (el.dataset.links !== undefined) {
    if (e.type !== 'change') return;
    const v = el.value.trim(); let arr = [];
    if (v) { try { arr = JSON.parse(v); } catch (x) { arr = null; } }
    if (!Array.isArray(arr) || arr.some(l => !l || typeof l.label !== 'string' || !/^https:\/\//i.test(l.href || ''))) { toast(t('e_links'), 1); return; }
    co().footerLinks = arr.map(l => ({ label: l.label, href: l.href })); save(); renderChrome(); toast(t('m_saved_edit')); return;
  }
  if (el.dataset.socicon) { if (e.type === 'change') A.socicon(el.dataset.socicon, el.files[0]); return; }
  if (el.dataset.cart) {
    CART[el.dataset.cart] = Math.max(0, +el.value || 0);
    const a = byId(S.addons, el.dataset.cart), ln = $('#ct-l-' + el.dataset.cart);
    if (a && ln) ln.textContent = sar(cartLine(a).total);
    $('#cart-total').textContent = sar(cartTotal()); $('#cart-pay').disabled = cartTotal() <= 0;
    return;
  }
  if (el.dataset.scene !== undefined) { if (e.type === 'change') A.scfiles(el.files); return; }
  if (el.dataset.m) {
    const ks = el.dataset.m.split('.'), last = ks.pop(), o = ks.reduce((o, k) => o[k], S);
    o[last] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +el.value : el.value;
    if (el.dataset.legal !== undefined && el.value.trim()) co().showLegal = true;
    save();
    if (/^settings\.(company|brand)\./.test(el.dataset.m)) { renderChrome(); if (el.dataset.legal !== undefined) { const cb = $('#co-legal'); if (cb) cb.checked = co().showLegal; } }
    if (el.dataset.re !== undefined && (e.type === 'change' || el.type === 'checkbox')) render();
  } else if (el.dataset.pl && e.type === 'change') {
    const p = byId(S.plans, el.dataset.pl), k = el.dataset.k;
    p[k] = k === 'name' ? (el.value.trim() || p.name) : Math.max(0, +el.value || 0);
    save(); toast(t('m_saved_edit'));
  }
}
document.addEventListener('input', e => { if (e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') bind(e); });
document.addEventListener('change', e => { const el = e.target; if (el.type === 'checkbox' || el.tagName === 'SELECT' || el.dataset.pl || el.dataset.ref !== undefined || el.dataset.scene !== undefined || el.dataset.re !== undefined || el.dataset.socicon || el.dataset.logo || el.dataset.logotext || el.dataset.links !== undefined) bind(e); });

/* ---------- boot ---------- */
loadState();
const hash = location.hash.slice(1); if (V[hash]) S.route = hash;
render();
mload().then(() => { if (MEDIA.size) render(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') renderChrome(); }); } catch (e) {}
/* Installable app: register the offline worker when served over https (not from a file or an embedded preview). */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !inFrame) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { imgCache.clear(); render(); });

</script>
